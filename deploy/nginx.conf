server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Upload maksimum (media soal & snapshot proctor melewati /api/):
    # tanpa ini nginx default 1m → 413 di produksi saat guru mengunggah media.
    client_max_body_size 25m;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API ke backend (diisi host service Coolify)
    # Media & snapshot proctor di-serve via API (/api/v1/...), jadi satu
    # location ini mencakup semuanya.
    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://flowcbt-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }
}
