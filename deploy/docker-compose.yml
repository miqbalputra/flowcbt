services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowcbt
      POSTGRES_PASSWORD: flowcbt_dev
      POSTGRES_DB: flowcbt
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowcbt"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6380:6379"]

volumes:
  pgdata:
