name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — vet, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowcbt
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: 'postgres://postgres:postgres@127.0.0.1:55432/flowcbt?sslmode=disable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: backend/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests
        run: go test ./internal/... -count=1
      - name: Migrasi
        run: go run ./cmd/migrate -dir db/migrations up
      - name: Siapkan role DB untuk test
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d flowcbt \
            -c "ALTER ROLE flowcbt_app LOGIN PASSWORD 'flowcbt_app'"
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 55432 -U postgres -d flowcbt \
            -c "ALTER ROLE flowcbt_system LOGIN PASSWORD 'flowcbt_system'"
      - name: "Integration tests (RLS, webhook, sync)"
        run: go test ./test/integration/... -count=1 -timeout 20m

  web:
    name: Web — typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enable pnpm
        run: corepack enable && pnpm --version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build (tsc + vite kedua app)
        run: pnpm -r build
      - name: Tests
        run: pnpm -r --if-present test
