name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          cd backend
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then echo "gofmt diperlukan: $UNFORMATTED"; exit 1; fi
      - name: go vet
        run: go -C backend vet ./...
      - name: go test
        run: go -C backend test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: tsc
        run: npx tsc -b --noEmit
      - name: build
        run: npm run build
