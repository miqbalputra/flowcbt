# flowcbt-web — Nginx container (PRD 7.4)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aset statis Vite: cache agressif (nama file di-hash)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API same-origin → service flowcbt-api (jaringan internal Coolify)
    location /api/v1/ {
        proxy_pass http://api:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # App siswa (PWA) di /exam/
    location /exam/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /exam/index.html;
    }
    location = /exam {
        return 301 /exam/;
    }

    # Rest → app guru (SPA fallback)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
