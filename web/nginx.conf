# flowcbt-web — Nginx container (PRD 7.4)
# X-05/C-14: file ini dipakai sebagai template oleh nginx resmi (docker-entrypoint
# envsubst). Placeholder ${API_UPSTREAM} & ${CLIENT_MAX_BODY_SIZE} diisi dari env.
# ${DOLLAR} dipakai untuk variabel nginx agar tidak ikut tersubstitusi.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    include /etc/nginx/conf.d/security-headers.conf;

    location /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok";
    }

    # Aset statis Vite: cache agresif (nama file di-hash)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files ${DOLLAR}uri =404;
    }

    # API same-origin → service flowcbt-api (jaringan internal Coolify)
    location /api/v1/ {
        proxy_pass ${API_UPSTREAM}/api/v1/;
        proxy_set_header Host ${DOLLAR}host;
        proxy_set_header X-Real-IP ${DOLLAR}remote_addr;
        proxy_set_header X-Forwarded-For ${DOLLAR}proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${DOLLAR}scheme;
        proxy_read_timeout 60s;

        # C-14/B-07: SSE live report tidak boleh di-buffer atau diputus proxy.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # App siswa (PWA) di /exam/
    location /exam/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files ${DOLLAR}uri ${DOLLAR}uri/ /exam/index.html;
    }
    location = /exam {
        return 301 /exam/;
    }

    # Fallback: jangan pernah serve src/*.tsx (X-05).
    location ~* ^/(src|@vite|@react-refresh)/ { return 404; }
    location ~* \.(tsx?|map)$ { return 404; }

    # Rest → app guru (SPA fallback)
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/conf.d/security-headers.conf;
        try_files ${DOLLAR}uri ${DOLLAR}uri/ /index.html;
    }
}
