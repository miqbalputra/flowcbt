# C-14: header keamanan. Di-include di server DAN di location yang punya add_header,
# karena nginx tidak mewariskan add_header jika location memiliki add_header sendiri.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
# HSTS hanya dikirim lewat HTTPS; reverse proxy (Coolify/Traefik) yang mengakhiri TLS.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
